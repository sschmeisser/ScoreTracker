[platformio]
default_envs = cyd

[env:cyd]
platform  = espressif32@^6.9.0
board     = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; Classic ESP32-D0WD-V3 with an external CH340 USB-serial bridge.
; No native USB-CDC flags here (contrast with the ESP32-C3 round tracker).

; Pin esptool to the tasmota v4.8.11 fork (bundles intelhex cleanly), matching
; the parent project. The default tool-esptoolpy @ ~2.41100.0 fails elf2image
; with ModuleNotFoundError: intelhex in this environment.
platform_packages =
    tool-esptoolpy@https://github.com/tasmota/esptool.git#v4.8.11

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.2.1
