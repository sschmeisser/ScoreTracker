[platformio]
default_envs = esp32-2424s012

[env:esp32-2424s012]
platform  = espressif32@^6.9.0
board     = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyACM0
platform_packages =
    tool-esptoolpy@https://github.com/tasmota/esptool.git#v4.8.11
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_LCD_SCLK=6
    -DPIN_LCD_MOSI=7
    -DPIN_LCD_DC=2
    -DPIN_LCD_CS=10
    -DPIN_LCD_BL=3
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
